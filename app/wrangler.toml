name = "clipai-v2"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ─── KV Namespaces ───────────────────────────────────────────────────────────
# DO NOT configure KV bindings here for Cloudflare Pages — Pages ignores
# kv_namespaces in wrangler.toml. Bind them in the dashboard instead:
#   Workers & Pages → clipai-v2 → Settings → Functions → KV namespace bindings
#
# Add two bindings:
#   - Variable name: CACHE_KV      → KV namespace: CACHE
#   - Variable name: RATELIMIT_KV  → KV namespace: RATELIMIT
#
# (Create the namespaces first under Storage & Databases → KV)
#
# If you don't bind them, the app still works — it just fails open
# (no caching, no rate limiting). Strongly recommended for production.

# ─── Environment variables ────────────────────────────────────────────────────
# Secrets (Supabase service key, Paystack secret, LLM keys, etc.) should be set
# via `wrangler pages secret put NAME` or in the dashboard. They are NOT safe
# to commit to this file.
#
# Non-secret vars can be set here:
[vars]
LLM_MODEL = ""
