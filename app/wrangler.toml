name = "clipai"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ─── KV Namespaces ───────────────────────────────────────────────────────────
# Bound via wrangler.toml (supported by wrangler 3.x+ for Pages projects).
# These two namespaces power the L1+L2 cache layer + KV-backed rate limiter.
# If you ever need to rebind, edit the IDs below and re-run `wrangler pages deploy`.

[[kv_namespaces]]
binding = "CACHE_KV"
id = "a674234abe5a49a6969f62de599698cd"        # CACHE namespace

[[kv_namespaces]]
binding = "RATELIMIT_KV"
id = "89b1c95ef8314b11b9bfdf7a15469833"        # RATELIMIT namespace

# ─── Environment variables ────────────────────────────────────────────────────
# Secrets (Supabase service key, Paystack secret, LLM keys, WORKER_SECRET, etc.)
# are set via `wrangler pages secret put NAME` or in the dashboard. They are
# NOT safe to commit to this file.
#
# Non-secret vars can be set here:
[vars]
LLM_MODEL = ""
